name: Build Pomme iOS IPA

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/pomme-ios-ipa.yml
      - tools/ios-ci-build.sh
      - tools/fetch_moltenvk.py
      - tools/build_openal.py
      - tools/fetch_openal.py
      - pomme-ios/**
      - pomme-client/**
      - pomme-gpu-allocator/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pomme-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-ipa:
    name: Build and verify unsigned iOS ARM64 IPA
    runs-on: macos-26
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: '2'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Checkout pinned source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install native build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen cmake ninja

      - name: Install pinned Rust toolchain and iOS target
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --fail --silent --show-error https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install nightly-2026-08-21 --profile minimal
          rustup target add --toolchain nightly-2026-08-21 aarch64-apple-ios
          rustc --version

      - name: Compile, validate and package Pomme iOS
        shell: bash
        run: bash tools/ios-ci-build.sh

      - name: Upload verified IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pomme-iOS-ARM64-unsigned
          path: |
            target/ios-build/Pomme-unsigned.ipa
            target/ios-build/Pomme-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Preserve Rust and Xcode build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pomme-iOS-build-diagnostics
          path: |
            target/ios-build/*.log
            target/ios-build/*.txt
          if-no-files-found: ignore
          retention-days: 7
