# Pomme iOS device build (unsigned, must be signed before installation).
# The same tools/ios-ci-build.sh runs on GitHub Actions and Codemagic.
workflows:
  pomme-ios-unsigned:
    name: Pomme iOS ARM64 - verified unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 26.6
      vars:
        CARGO_BUILD_JOBS: "2"
    scripts:
      - name: Verify source and fetch pinned submodules
        script: |
          set -euo pipefail
          git rev-parse HEAD
          test -f pomme-ios/project.yml
          test -f tools/ios-ci-build.sh
          git submodule update --init --recursive
          xcodebuild -version

      - name: Install native macOS build tools
        script: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install xcodegen cmake ninja
          xcodegen --version
          cmake --version

      - name: Install pinned Rust and ARM64 iOS target
        script: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --fail --silent --show-error https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          rustup toolchain install nightly-2026-08-21 --profile minimal
          rustup target add --toolchain nightly-2026-08-21 aarch64-apple-ios
          cargo --version
          rustc --version

      - name: Build, validate and package actual iOS ARM64 app
        script: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          bash tools/ios-ci-build.sh

    artifacts:
      - target/ios-build/Pomme-unsigned.ipa
      - target/ios-build/Pomme-unsigned.ipa.sha256
      - target/ios-build/*.log
      - target/ios-build/*.txt
